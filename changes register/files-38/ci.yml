name: SDPipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build + Test
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14        # Apple Silicon runner — M1 chip, Xcode 15+

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build (Release)
        run: |
          xcodebuild \
            -project SDPipeline.xcodeproj \
            -scheme SDPipeline \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty --color

      # ── Unit Tests ─────────────────────────────────────────────────────
      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project SDPipeline.xcodeproj \
            -scheme SDPipeline \
            -testPlan SDPipelineTests \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            test | xcpretty --color --report junit --output test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — SwiftLint (no bloquea el merge, solo advierte)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-14
    continue-on-error: true   # No bloquea el PR — solo informativo

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — Security Audit (verifica que no hay secrets en el código)
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml    # opcional — usa defaults si no existe

      # Verificar que no hay API keys hardcodeadas en Swift
      - name: Check for hardcoded API keys in Swift files
        run: |
          echo "Buscando patrones de API keys hardcodeadas…"
          FOUND=0
          
          # Buscar patrones comunes de API keys
          if grep -r --include="*.swift" -E "(api_key|apiKey|API_KEY|secret_key)\s*=\s*\"[A-Za-z0-9]{20,}\"" . 2>/dev/null; then
            echo "❌ Se encontraron posibles API keys hardcodeadas"
            FOUND=1
          fi
          
          # Verificar que Keychain se usa para claves sensibles (no UserDefaults)
          if grep -r --include="*.swift" "UserDefaults.*aes\|UserDefaults.*key\|UserDefaults.*secret" . --ignore-case 2>/dev/null | grep -v "//"; then
            echo "⚠️  Posibles claves sensibles en UserDefaults — verificar manualmente"
          fi
          
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "✅ Sin API keys hardcodeadas detectadas"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 — Notificación de resultado (resumen en PR)
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, security-scan]
    if: always()

    steps:

      - name: Write summary
        run: |
          echo "## SDPipeline CI Results 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅' || '❌' }} ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftLint    | ${{ needs.lint.result == 'success' && '✅' || '⚠️' }} ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security     | ${{ needs.security-scan.result == 'success' && '✅' || '❌' }} ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Rama: \`${{ github.ref_name }}\` · Commit: \`${{ github.sha }}\`_" >> $GITHUB_STEP_SUMMARY
